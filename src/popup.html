<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Meet Transcript Export</title>
<style>
  body { font: 13px/1.4 Roboto, Arial, sans-serif; width: 360px; margin: 0; color: #202124; }
  header { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 14px; margin: 0; }
  header a { font-size: 12px; color: #1a73e8; text-decoration: none; }
  #list { max-height: 400px; overflow-y: auto; }
  .session { padding: 10px 12px; border-bottom: 1px solid #f1f3f4; }
  .session .title { font-weight: 500; }
  .session .meta { color: #5f6368; font-size: 11px; margin-top: 2px; }
  .session .actions { margin-top: 6px; display: flex; gap: 6px; }
  .session button { font: inherit; padding: 4px 8px; cursor: pointer; }
  .empty { padding: 20px 12px; color: #5f6368; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>Meet Transcript Export</h1>
    <a href="#" id="openOptions">Настройки</a>
  </header>
  <div id="list"><div class="empty">Загрузка…</div></div>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
